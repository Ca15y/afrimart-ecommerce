apiVersion: apps/v1
kind: Deployment
metadata:
  name: afrimart-backend
  namespace: production
  labels:
    app: afrimart-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: afrimart-backend
  template:
    metadata:
      labels:
        app: afrimart-backend
    spec:
      containers:
      - name: backend
        image: 843850122465.dkr.ecr.us-east-1.amazonaws.com/afrimart-backup/backend:latest
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: afrimart-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: afrimart-secrets
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: afrimart-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: afrimart-backend
  namespace: production
spec:
  selector:
    app: afrimart-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP
