apiVersion: apps/v1
kind: Deployment
metadata:
  name: afrimart-frontend
  namespace: production
  labels:
    app: afrimart-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: afrimart-frontend
  template:
    metadata:
      labels:
        app: afrimart-frontend
    spec:
      containers:
      - name: frontend
        image: 843850122465.dkr.ecr.us-east-1.amazonaws.com/afrimart-backup/frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: afrimart-frontend
  namespace: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: afrimart-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
